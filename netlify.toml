[build]
  command = "npm run build"
  publish = "dist/db-spread-bot/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html must always be re-fetched (it points to the latest hashed JS/CSS);
# hashed JS/CSS filenames change on every build, so they're safe to cache forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
